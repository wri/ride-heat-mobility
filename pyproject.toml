[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nairobi-heat-abm"
version = "0.1.0"
description = "Agent-based model of pedestrian mobility and heat exposure in Nairobi"
requires-python = ">=3.10"
dependencies = [
    # Graph
    "networkx>=3.3",
    "osmnx>=1.9",

    # Raster / geospatial
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "geopandas>=0.14",

    # Numerics
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "scikit-learn>=1.4",

    # UI
    "panel>=1.4",
    "param>=2.1",
    "hvplot>=0.10",
    "geoviews>=1.12",
    "plotly>=5.22",
    "bokeh>=3.4",

    # Config
    "pyyaml>=6.0",

    # Validation
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests requiring network access or large data"]

[tool.hatch.build.targets.wheel]
packages = ["nairobi_heat_abm"]
